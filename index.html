<style>
:root{
  --bg1:#0b0a1c; --bg2:#19143d; --ink:#ece8ff; --muted:#a59fcf;
  --gold:#e8c98a; --line:rgba(232,201,138,.28);
  --ok:#7fe0b0; --bad:#ff8fa3;
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.14);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--bg1);color-scheme:dark}
body{min-height:100vh;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(1200px 800px at 50% -10%,#2b2366 0%,var(--bg2) 38%,var(--bg1) 78%) fixed;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;border-radius:50%;background:#fff;opacity:var(--o);animation:tw 6s ease-in-out infinite}
@keyframes tw{50%{opacity:calc(var(--o) * .25)}}

.app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:28px 18px 56px}
header h1{font-family:var(--serif);font-weight:500;letter-spacing:.02em;font-size:clamp(28px,4vw,42px);margin:0;text-align:center}
header h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:6px auto 0;max-width:58ch;line-height:1.55;font-size:15px;text-align:center}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:20px 0 6px}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--glass2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:rgba(232,201,138,.16);color:var(--gold)}
.btn{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--ink);
  background:var(--glass);border:1px solid var(--glass2);transition:transform .12s,background .2s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#f2d9a2,#d5b06a);color:#23190a;border:0;font-weight:650}
.btn.primary.ready{animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(232,201,138,.18)}}
.btn.icon{padding:9px 12px;line-height:1}
.status{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:86px;text-align:right}

.howto{color:var(--muted);text-align:center;font-size:13.5px;margin:16px 0 0;letter-spacing:.01em}

/* ---------- board ---------- */
.board{position:relative;width:min(100%,600px);aspect-ratio:1;margin:14px auto 0;
  --es:64px;--lw:120px;--lh:32px}
@media (max-width:560px){.board{--es:50px;--lw:96px;--lh:28px}}
.board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.board .ring{fill:none;stroke:rgba(255,255,255,.06);stroke-width:.3;stroke-dasharray:.8 1.4}
.board line{stroke:var(--line);stroke-width:.45;stroke-linecap:round;transition:stroke .7s,stroke-width .7s,filter .7s}
.board line.solved{stroke:var(--gold);stroke-width:.65;filter:drop-shadow(0 0 1.4px rgba(232,201,138,.95))}
.board .hub{fill:var(--gold);opacity:.75}
.board.won .hub{animation:hub 2.4s ease-in-out infinite}
@keyframes hub{50%{opacity:1;filter:drop-shadow(0 0 2px var(--gold))}}

.node{position:absolute;width:0;height:0}
.slot{position:absolute;left:0;top:0;padding:0;font:inherit;color:inherit;cursor:pointer;
  border:1.5px dashed rgba(236,232,255,.26);background:rgba(11,10,28,.86);
  touch-action:manipulation;
  transition:border-color .2s,background .2s,box-shadow .25s,transform .2s}
.slot.emoji{width:var(--es);height:var(--es);border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center}
.slot.label{width:var(--lw);height:var(--lh);border-radius:999px;transform:translate(-50%,calc(var(--es) / 2 + 8px));display:flex}
.slot:hover{border-color:rgba(232,201,138,.5)}
.slot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.slot.open-slot{border-color:var(--gold);background:rgba(232,201,138,.12);
  box-shadow:0 0 0 3px rgba(232,201,138,.2),0 0 22px rgba(232,201,138,.45);
  animation:slotGlow 1.5s ease-in-out infinite alternate}
@keyframes slotGlow{
  to{box-shadow:0 0 0 5px rgba(232,201,138,.3),0 0 34px rgba(232,201,138,.65)}}
.slot.filled{border-style:solid;border-color:rgba(236,232,255,.2)}
.slot.ok{border:1.5px solid var(--ok);box-shadow:0 0 0 4px rgba(127,224,176,.12)}
.slot.bad{border:1.5px solid var(--bad);box-shadow:0 0 0 4px rgba(255,143,163,.12)}
.slot.emoji.bad{animation:shakeC .42s}
.slot.label.bad{animation:shakeL .42s}
@keyframes shakeC{25%{transform:translate(calc(-50% - 4px),-50%)}75%{transform:translate(calc(-50% + 4px),-50%)}}
@keyframes shakeL{25%{transform:translate(calc(-50% - 4px),calc(var(--es) / 2 + 8px))}75%{transform:translate(calc(-50% + 4px),calc(var(--es) / 2 + 8px))}}
.slot.hinted{animation:glow 1.4s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,201,138,.7)}100%{box-shadow:0 0 0 14px rgba(232,201,138,0)}}

/* ---------- placed value inside a slot ---------- */
.chip{pointer-events:none;line-height:1}
.chip.e{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--es) * .46)}
.chip.l{width:100%;height:100%;border-radius:999px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.chip.l b{font-weight:550}
.chip.l span{color:var(--gold);font-size:12px;letter-spacing:.04em}
@media (max-width:560px){.chip.l{font-size:12px;gap:4px}.chip.l span{font-size:10.5px}}

/* ---------- radial wheel picker ---------- */
#veil{position:fixed;inset:0;z-index:80;background:rgba(5,4,14,.34);
  opacity:0;pointer-events:none;transition:opacity .18s ease}
#veil.on{opacity:1;pointer-events:auto}
#hub{position:absolute;left:0;top:0;width:0;height:0}
.ropt{--oe:54px;
  position:absolute;left:0;top:0;width:var(--oe);height:var(--oe);border-radius:50%;
  display:grid;place-items:center;padding:0;cursor:pointer;
  font:inherit;font-size:calc(var(--oe) * .48);line-height:1;color:var(--ink);
  border:1.5px solid rgba(255,255,255,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  touch-action:manipulation;
  transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:1;
  transition:transform .34s cubic-bezier(.34,1.5,.5,1),opacity .26s ease,border-color .15s,background .15s,box-shadow .15s;
  transition-delay:calc(var(--i) * 30ms)}
@media (max-width:560px){.ropt{--oe:46px}}
.ropt.pre{transform:translate(-50%,-50%) scale(.25);opacity:0;transition-delay:0s;pointer-events:none}
.ropt:hover,.ropt:focus-visible{border-color:var(--gold);background:rgba(232,201,138,.18);outline:none;
  box-shadow:0 0 0 3px rgba(232,201,138,.22),0 8px 22px rgba(0,0,0,.45)}
.ropt.cur{border-color:var(--gold)}

/* ---------- label bottom sheet ---------- */
#drop{position:fixed;z-index:85;display:none;
  left:0;right:0;bottom:0;margin:0 auto;
  width:min(460px,100%);padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));
  border-radius:22px 22px 0 0;
  border:1px solid rgba(255,255,255,.16);border-bottom:0;
  background:linear-gradient(180deg,rgba(34,30,72,.44),rgba(12,10,30,.57));
  -webkit-backdrop-filter:blur(9px) saturate(150%);backdrop-filter:blur(9px) saturate(150%);
  box-shadow:0 -18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14)}
#drop.on{display:block;animation:sheetIn .34s cubic-bezier(.16,1,.3,1)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
#drop::after{content:"";position:absolute;top:-11px;left:var(--tx,50%);
  border:11px solid transparent;border-bottom:12px solid rgb(30,26,64);
  pointer-events:none;opacity:0;
  animation:tailIn .3s .08s cubic-bezier(.16,1,.3,1) forwards}
@keyframes tailIn{
  from{opacity:0;transform:translateX(-50%) translateY(10px)}
  to{opacity:1;transform:translateX(-50%)}}
.dlist{max-height:min(64vh,410px);overflow:auto;
  -webkit-overflow-scrolling:touch}
#drop button{display:flex;width:100%;gap:12px;align-items:center;padding:12px 14px;
  border:0;border-radius:14px;background:transparent;color:var(--ink);
  font:inherit;font-size:16px;cursor:pointer;text-align:left;
  touch-action:manipulation;
  opacity:0;transform:translateY(10px);
  transition:opacity .24s ease,transform .24s ease,background .12s;
  transition-delay:calc(60ms + var(--i) * 30ms)}
#drop.on button{opacity:1;transform:none}
#drop button:hover,#drop button:focus-visible{background:rgba(232,201,138,.14);outline:none}
#drop button.cur{background:rgba(232,201,138,.1)}
#drop button .nm{font-weight:550}
#drop button .id{margin-left:auto;color:var(--gold);font-size:13px;letter-spacing:.05em}

/* ---------- bonds legend ---------- */
.bonds{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.bonds li{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.08);transition:border-color .6s,background .6s}
.bonds li.open{border-color:rgba(232,201,138,.4);background:rgba(232,201,138,.07)}
.bp{display:flex;align-items:center;gap:6px;font-size:22px;min-width:86px;color:var(--muted)}
.bp i{display:block;width:22px;height:1.5px;background:currentColor;opacity:.5}
.open .bp i{background:var(--gold);opacity:1}
.bt b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;color:var(--muted)}
.open .bt b{color:var(--gold)}
.bt small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.4}

.result{min-height:24px;margin:16px 0 0;text-align:center;font-size:15px;color:var(--ink)}
.result em{color:var(--gold);font-style:normal}
.chant{text-align:center;font-family:var(--serif);color:var(--gold);font-size:clamp(17px,2.4vw,22px);letter-spacing:.03em;
  margin:6px 0 0;opacity:0;transform:translateY(6px);transition:opacity 1.2s,transform 1.2s}
.chant.show{opacity:1;transform:none}

.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);
  transform:translate(-50%,-50%);animation:fly 1.3s cubic-bezier(.2,.7,.2,1) forwards;pointer-events:none;z-index:5}
@keyframes fly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.foot{margin:34px auto 0;max-width:64ch;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.foot p{margin:6px 0}
</style>
</head>
<body>

<main class="app">

    <h1 id="h1">The <span>Compass</span></h1>

  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="exact" aria-pressed="true">Exact picture</button>
      <button type="button" data-mode="opposites" aria-pressed="false">Opposites only</button>
    </div>
    <button type="button" class="btn primary" id="checkBtn">Check</button>

    <p>Unofficial. Not affiliated with MBTI® or The Myers-Briggs Company.</p>
  </footer>
</main>

<div id="veil" aria-hidden="true"><div id="hub"></div></div>
<div id="drop" role="listbox"></div>

<script src="locales.js"></script>
<script>
(() => {
  const FN = {
    Ni:{e:'🔮', n:'Seer',      t:'INFJ · INTJ', opp:'Se'},
    Ti:{e:'🧩', n:'Architect', t:'INTP · ISTP', opp:'Fe'},
    Si:{e:'📜', n:'Keeper',    t:'ISFJ · ISTJ', opp:'Ne'},
    Te:{e:'⚙️', n:'General',   t:'ENTJ · ESTJ', opp:'Fi'},
    Se:{e:'🏄', n:'Surfer',    t:'ESFP · ESTP', opp:'Ni'},
    Fe:{e:'🤝', n:'Host',      t:'ENFJ · ESFJ', opp:'Ti'},
    Ne:{e:'🎈', n:'Inventor',  t:'ENFP · ENTP', opp:'Si'},
    Fi:{e:'🕯️', n:'Monk',      t:'INFP · ISFP', opp:'Te'},
  };
  const FN_KEYS = Object.keys(FN);
  // clockwise from the top; slot i faces slot i+4 across the centre
  const RING = ['Ni','Ti','Si','Te','Se','Fe','Ne','Fi'];
  const BONDS = [
    {a:'Ni', b:'Se'},
    {a:'Ne', b:'Si'},
    {a:'Ti', b:'Fe'},
    {a:'Te', b:'Fi'},
  ];
  const CX = 50, CY = 48, R = 33;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let locale = 'en';
  const t = () => LOCALES[locale];
  const nameOf = id => t().fn[id];
  function detectLocale() {
    try {
      const saved = localStorage.getItem('compass-locale');
      if (saved && LOCALES[saved]) return saved;
    } catch {}
    const list = (typeof navigator !== 'undefined' && (navigator.languages || [navigator.language])) || [];
    for (const raw of list) {
      if (!raw) continue;
      const k = String(raw).toLowerCase();
      if (k.startsWith('zh')) return /tw|hk|mo|hant/.test(k) ? 'zh-TW' : 'zh-CN';
      if (k.startsWith('pt')) return 'pt-BR';
      const base = k.split('-')[0];
      if (LOCALES[base]) return base;
    }
    return 'en';
  }
  locale = detectLocale();

  const $ = s => document.querySelector(s);
  const board = $('#board'), svg = $('#lines');
  const veil = $('#veil'), hub = $('#hub'), drop = $('#drop');
  let mode = 'exact', checks = 0, hints = 0;

  /* ---------- sound: everything is synthesised, nothing is a sample ----------
     Each compass position owns a note of D major. Position i and its opposite
     i+4 sit exactly a perfect fifth (7 semitones) apart, so every solved bond
     rings as the most consonant interval there is.                          */
  const Sound = (() => {
    const SEMI = [0, 2, 4, 7, 7, 9, 11, 14];          // slot i -> semitones above D4
    const BASE = 293.66;
    const fSlot = i => BASE * 2 ** (SEMI[i] / 12);
    const PENTA = [0, 2, 4, 7, 9];
    let ctx = null, master = null, wet = null;
    let on = localStorage.getItem('compass-sound') !== 'off';

    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .55;
      const comp = ctx.createDynamicsCompressor();
      master.connect(comp); comp.connect(ctx.destination);
      const d = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
      d.delayTime.value = .27; fb.gain.value = .33; lp.type = 'lowpass'; lp.frequency.value = 2000;
      wet = ctx.createGain(); wet.gain.value = .3;
      wet.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
    }
    const ready = () => on && ctx && ctx.state !== 'closed';
    const panOf = x => x == null ? 0 : clamp((x / innerWidth) * 2 - 1, -1, 1) * .7;
    function route(node, pan, send = 1) {
      let n = node;
      if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; node.connect(p); n = p; }
      n.connect(master);
      if (send) { const s = ctx.createGain(); s.gain.value = send; n.connect(s); s.connect(wet); }
    }
    function env(g, t, a, peak, dur) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    }
    function bell(freq, {at = 0, dur = 1.4, gain = .22, pan = 0, ratio = 3.5, bright = 1.6, send = 1} = {}) {
      if (!ready()) return;
      const t = ctx.currentTime + at;
      const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
      car.frequency.value = freq; mod.frequency.value = freq * ratio;
      mg.gain.setValueAtTime(freq * bright, t);
      mg.gain.exponentialRampToValueAtTime(freq * .02, t + dur * .6);
      mod.connect(mg); mg.connect(car.frequency);
      env(g, t, .006, gain, dur);
      car.connect(g); route(g, pan, send);
      car.start(t); mod.start(t); car.stop(t + dur + .05); mod.stop(t + dur + .05);
    }
    function blip(f1, f2, {at = 0, dur = .12, gain = .08, type = 'sine', pan = 0, send = .4} = {}) {
      if (!ready()) return;
      const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      env(g, t, .004, gain, dur);
      o.connect(g); route(g, pan, send); o.start(t); o.stop(t + dur + .03);
    }
    function tap({at = 0, gain = .12, pan = 0, freq = 1400} = {}) {
      if (!ready()) return;
      const t = ctx.currentTime + at, len = .07;
      const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * len), ctx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length) ** 3;
      const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.2; g.gain.value = gain;
      src.connect(bp); bp.connect(g); route(g, pan, .15); src.start(t);
    }
    const pentaNote = (oct, k) => BASE * 2 ** (oct + PENTA[k % 5] / 12 + Math.floor(k / 5));

    return {
      init,
      get on() { return on; },
      toggle() { on = !on; localStorage.setItem('compass-sound', on ? 'on' : 'off'); if (on) { init(); bell(fSlot(0) * 2, {gain: .12, dur: .8}); } return on; },
      tick(x) { blip(2200, 1800, {dur: .03, gain: .03, pan: panOf(x), send: 0}); },
      pick(x) { blip(520, 880, {dur: .09, gain: .07, pan: panOf(x)}); },
      hover(i, x) { blip(fSlot(i) * 4, fSlot(i) * 4, {dur: .05, gain: .025, pan: panOf(x), send: .2}); },
      select(x) { blip(660, 990, {dur: .07, gain: .05, pan: panOf(x)}); },
      unselect(x) { blip(990, 660, {dur: .07, gain: .04, pan: panOf(x)}); },
      place(i, kind, x, paired) {
        const f = fSlot(i) * (kind === 'emoji' ? 1 : .5);
        bell(f, {gain: kind === 'emoji' ? .2 : .16, bright: kind === 'emoji' ? 1.8 : .9, pan: panOf(x)});
        tap({gain: .05, pan: panOf(x), freq: 900});
        if (paired) bell(fSlot(i) * 1.5, {at: .09, gain: .07, dur: 1.1, ratio: 2, bright: .6, pan: panOf(x)});
      },
      wrong(x) {
        if (!ready()) return;
        blip(150, 110, {dur: .22, gain: .06, type: 'square', pan: panOf(x), send: 0});
        blip(158, 116, {dur: .22, gain: .05, type: 'square', pan: panOf(x), send: 0});
      },
      check(states, solvedLines, won) {
        if (!ready()) return;
        const step = .085;
        states.forEach((s, i) => {
          const pan = Math.sin((-90 + 45 * i) * Math.PI / 180 + Math.PI / 2) * .6;
          if (s === 'ok') bell(fSlot(i), {at: i * step, gain: .16, dur: 1.1, pan});
          else if (s === 'bad') blip(120, 70, {at: i * step, dur: .16, gain: .09, pan, send: .1});
        });
        const after = states.length * step + .1;
        solvedLines.forEach((l, k) => {
          bell(fSlot(l), {at: after + k * .16, gain: .13, dur: 2, ratio: 2, bright: .9, pan: -.4});
          bell(fSlot(l + 4), {at: after + k * .16, gain: .13, dur: 2, ratio: 2, bright: .9, pan: .4});
        });
        if (won) this.win(after + solvedLines.length * .16 + .2);
      },
      win(at = 0) {
        if (!ready()) return;
        [...new Set(SEMI)].concat([12, 16, 19, 24]).forEach((s, k) =>
          bell(BASE * 2 ** (s / 12), {at: at + k * .07, gain: .12, dur: 2.4, pan: Math.sin(k) * .6}));
        [0, 7, 12, 16].forEach(s => bell(BASE / 2 * 2 ** (s / 12), {at: at + .9, gain: .09, dur: 4, ratio: 2, bright: .5}));
        for (let k = 0; k < 14; k++)
          blip(pentaNote(2, k), pentaNote(2, k), {at: at + 1 + Math.random() * 1.6, dur: .08, gain: .03, pan: Math.random() * 1.6 - .8});
      },
      hint() { for (let k = 0; k < 6; k++) blip(pentaNote(1, k * 2), pentaNote(1, k * 2 + 1), {at: k * .045, dur: .07, gain: .045, pan: -.5 + k * .2}); },
      reset() {
        if (!ready()) return;
        for (let k = 0; k < 10; k++) {
          const f = pentaNote(1, Math.random() * 10 | 0);
          blip(f, f * .98, {at: k * .032 + Math.random() * .02, dur: .08, gain: .035, pan: Math.random() * 1.4 - .7, send: .5});
        }
      },
    };
  })();

  /* ---------- stars ---------- */
  const sky = document.querySelector('.sky');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('i');
    const z = Math.random() * 1.6 + .4;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;--o:${.2+Math.random()*.6};animation-delay:${Math.random()*6}s`;
    sky.append(s);
  }

  /* ---------- board ---------- */
  const pos = i => { const a = (-90 + 45 * i) * Math.PI / 180; return {x: CX + R * Math.cos(a), y: CY + R * Math.sin(a)}; };
  let s = `<circle class="ring" cx="${CX}" cy="${CY}" r="${R}"/>`;
  for (let i = 0; i < 4; i++) {
    const p = pos(i), q = pos(i + 4);
    s += `<line id="line${i}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" style="transition-delay:${i*.18}s"/>`;
  }
  s += `<circle class="hub" cx="${CX}" cy="${CY}" r="1.3"/>`;
  svg.innerHTML = s;

  const state = { emoji: Array(8).fill(null), label: Array(8).fill(null) };
  const slots = RING.map((_, i) => {
    const p = pos(i);
    const node = document.createElement('div');
    node.className = 'node';
    node.style.left = p.x + '%'; node.style.top = p.y + '%';
    const se = mkSlot('emoji', i);
    const sl = mkSlot('label', i);
    node.append(se, sl); board.append(node);
    return {emoji: se, label: sl};
  });
  function mkSlot(kind, i) {
    const b = document.createElement('div');
    b.className = 'slot ' + kind;
    b.dataset.kind = kind; b.dataset.idx = i;
    b.setAttribute('role', 'button'); b.tabIndex = 0;
    b.setAttribute('aria-haspopup', 'listbox');
    b.setAttribute('aria-expanded', 'false');
    b.addEventListener('click', () => onSlotActivate(kind, i));
    b.addEventListener('keydown', e => {
      if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onSlotActivate(kind, i); }
    });
    return b;
  }
  function onSlotActivate(kind, i) {
    Sound.init();
    if (open && open.kind === kind && open.idx === i) { closePicker(); return; }
    openPicker(kind, i);
  }

  const centerX = el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };

  /* ---------- state → DOM ---------- */
  function renderSlot(kind, i) {
    const slot = slots[i][kind], fn = state[kind][i];
    slot.classList.toggle('filled', !!fn);
    slot.innerHTML = '';
    if (fn) {
      const v = document.createElement('span');
      v.className = 'chip ' + (kind === 'emoji' ? 'e' : 'l');
      if (kind === 'emoji') v.textContent = FN[fn].e;
      else v.innerHTML = `<b>${nameOf(fn)}</b><span>${fn}</span>`;
      slot.append(v);
    }
    const L = t();
    const base = kind === 'emoji' ? L.blankEmoji(i + 1) : L.blankLabel(i + 1);
    slot.dataset.base = base;
    slot.setAttribute('aria-label', fn ? `${base}: ${kind === 'emoji' ? nameOf(fn) + ' ' + FN[fn].e : nameOf(fn)}` : base);
  }
  function setValue(kind, i, fn) {
    if (fn === null) {
      state[kind][i] = null;
      renderSlot(kind, i);
      clearMarks();
      afterChange();
      return;
    }
    const other = state[kind].indexOf(fn);
    if (other !== -1 && other !== i) {
      state[kind][other] = state[kind][i];
      renderSlot(kind, other);
    }
    state[kind][i] = fn;
    renderSlot(kind, i);
    clearMarks();
    afterChange();
  }
  const anyPlaced = () => state.emoji.some(Boolean) || state.label.some(Boolean);

  /* ---------- pickers ---------- */
  let open = null;
  function closePicker(restoreFocus = true) {
    if (!open) return;
    const {slot} = open;
    open = null;
    veil.classList.remove('on');
    drop.classList.remove('on');
    slot.classList.remove('open-slot');
    slot.setAttribute('aria-expanded', 'false');
    const hubKids = [...hub.children];
    hubKids.forEach(el => el.classList.add('pre'));
    setTimeout(() => { if (!open) { hub.innerHTML = ''; drop.innerHTML = ''; } }, 360);
    if (restoreFocus) slot.focus({preventScroll: true});
  }
  function openPicker(kind, i) {
    closePicker(false);
    const slot = slots[i][kind];
    open = {kind, idx: i, slot};
    slot.classList.add('open-slot');
    slot.setAttribute('aria-expanded', 'true');
    Sound.select(centerX(slot));
    if (kind === 'emoji') openRadial(i); else openDrop(i);
  }
  function openRadial(i) {
    const slot = slots[i].emoji, cur = state.emoji[i];
    const rect = slot.getBoundingClientRect();
    const small = innerWidth < 560;
    const RD = small ? 70 : 92, OE = small ? 46 : 54;
    const pad = RD + OE / 2 + 12;
    const cx = clamp(rect.left + rect.width / 2, pad, innerWidth - pad);
    const cy = clamp(rect.top + rect.height / 2, pad, innerHeight - pad);
    hub.style.left = cx + 'px'; hub.style.top = cy + 'px';
    FN_KEYS.forEach((id, k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ropt pre' + (cur === id ? ' cur' : '');
      b.style.setProperty('--i', k);
      const a = -Math.PI / 2 + k * Math.PI / 4;
      b.style.setProperty('--dx', (RD * Math.cos(a)).toFixed(1) + 'px');
      b.style.setProperty('--dy', (RD * Math.sin(a)).toFixed(1) + 'px');
      b.textContent = FN[id].e;
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', cur === id);
      b.setAttribute('aria-label', t().fnEmoji(nameOf(id)));
      b.addEventListener('click', ev => { ev.stopPropagation(); choose('emoji', i, id); });
      hub.append(b);
    });
    veil.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      hub.querySelectorAll('.ropt').forEach(el => el.classList.remove('pre'));
      hub.querySelector('.ropt')?.focus({preventScroll: true});
    }));
  }
  function openDrop(i) {
    const slot = slots[i].label, cur = state.label[i];
    const sRect = slot.getBoundingClientRect();
    drop.textContent = '';
    const list = document.createElement('div'); list.className = 'dlist';
    FN_KEYS.forEach((id, k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = cur === id ? 'cur' : '';
      b.style.setProperty('--i', k);
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', cur === id);
      b.innerHTML = `<span class="nm">${nameOf(id)}</span><span class="id">${id}</span>`;
      b.addEventListener('click', ev => { ev.stopPropagation(); choose('label', i, id); });
      list.append(b);
    });
    drop.append(list);
    drop.classList.add('on');
    veil.classList.add('on');
    const dRect = drop.getBoundingClientRect();
    const padL = dRect.left + drop.clientLeft;
    const padW = drop.clientWidth;
    const tx = clamp(sRect.left + sRect.width / 2 - padL, 30, padW - 30);
    drop.style.setProperty('--tx', tx + 'px');
    list.querySelector('button')?.focus({preventScroll: true});
  }
  function choose(kind, i, id) {
    const clearing = state[kind][i] === id;
    setValue(kind, i, clearing ? null : id);
    const slot = slots[i][kind];
    closePicker();
    if (!clearing)
      Sound.place(i, kind, centerX(slot), state.emoji[i] === state.label[i] && !!state.emoji[i]);
  }
  veil.addEventListener('click', () => closePicker());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

  /* ---------- checking ---------- */
  const getNode = i => ({e: state.emoji[i], l: state.label[i]});
  function nodeCorrect(i) {
    const {e, l} = getNode(i);
    if (mode === 'exact') return e === RING[i] && l === RING[i];
    if (!e || e !== l) return false;
    const o = getNode((i + 4) % 8);
    return o.e === o.l && o.e === FN[e].opp;
  }
  function mark(slot, ok) { slot.classList.add(ok ? 'ok' : 'bad'); }
  function clearMarks(hard) {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('ok', 'bad'));
    document.querySelectorAll('.board line').forEach(l => l.classList.remove('solved'));
    board.classList.remove('won');
    $('#chant').classList.remove('show');
    $('#result').textContent = '';
    if (hard) { checks = 0; hints = 0; renderBonds(true); }
  }

  const opened = new Set();
  function renderBonds(reset) {
    if (reset) opened.clear();
    const L = t();
    $('#bonds').innerHTML = BONDS.map((b, i) => {
      const A = FN[b.a], B = FN[b.b];
      return opened.has(i)
        ? `<li class="open"><div class="bp">${A.e}<i></i>${B.e}</div><div class="bt"><b>${L.bonds[i].replace('&','&amp;')}</b><small>${nameOf(b.a)} ${A.t} ↔ ${nameOf(b.b)} ${B.t}</small></div></li>`
        : `<li><div class="bp">◌<i></i>◌</div><div class="bt"><b>? &amp; ?</b><small>${L.bondHint}</small></div></li>`;
    }).join('');
  }

  function check() {
    closePicker(false); clearMarks(); checks++;
    let correct = 0;
    for (let i = 0; i < 8; i++) {
      const ok = nodeCorrect(i), {e, l} = getNode(i);
      if (ok) correct++;
      if (mode === 'exact') {
        if (e) mark(slots[i].emoji, e === RING[i]);
        if (l) mark(slots[i].label, l === RING[i]);
      } else if (ok) {
        mark(slots[i].emoji, true); mark(slots[i].label, true);
      } else if (e || l) {
        const o = getNode((i + 4) % 8);
        const pairOk = e && l && e === l, partnerSet = o.e && o.l && o.e === o.l;
        if (!pairOk || partnerSet) { if (e) mark(slots[i].emoji, false); if (l) mark(slots[i].label, false); }
      }
    }
    const solvedLines = [];
    for (let i = 0; i < 4; i++) {
      if (nodeCorrect(i) && nodeCorrect(i + 4)) {
        $('#line' + i).classList.add('solved');
        solvedLines.push(i);
        const f = getNode(i).e;
        opened.add(BONDS.findIndex(b => b.a === f || b.b === f));
      }
    }
    renderBonds();
    const states = slots.map(s => (s.emoji.classList.contains('bad') || s.label.classList.contains('bad')) ? 'bad'
      : (s.emoji.classList.contains('ok') || s.label.classList.contains('ok')) ? 'ok' : 'none');
    Sound.check(states, solvedLines, correct === 8);
    const res = $('#result');
    if (correct === 8) win();
    else if (correct === 0 && !anyPlaced()) res.textContent = t().result.empty;
    else res.innerHTML = t().result.partial(correct, mode);
  }

  function win() {
    board.classList.add('won');
    $('#chant').classList.add('show');
    $('#result').innerHTML = t().result.win(checks, hints);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (let i = 0; i < 30; i++) {
      const sp = document.createElement('span');
      const a = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 190;
      sp.className = 'spark';
      sp.style.cssText = `left:${CX}%;top:${CY}%;--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;animation-delay:${Math.random()*.3}s`;
      board.append(sp); setTimeout(() => sp.remove(), 1800);
    }
  }

  function hint() {
    closePicker(false); clearMarks();
    let target = null, fn = null;
    if (mode === 'exact') {
      for (let i = 0; i < 8; i++) if (!nodeCorrect(i)) { target = i; fn = RING[i]; break; }
    } else {
      for (let i = 0; i < 8 && target === null; i++) {
        if (nodeCorrect(i)) continue;
        const o = getNode((i + 4) % 8);
        if (o.e && o.e === o.l) { target = i; fn = FN[o.e].opp; }
      }
      if (target === null) {
        const used = new Set();
        for (let i = 0; i < 8; i++) if (nodeCorrect(i)) used.add(getNode(i).e);
        for (let i = 0; i < 8; i++) if (!nodeCorrect(i)) { target = i; break; }
        fn = RING.find(f => !used.has(f));
      }
    }
    if (target === null) { $('#result').innerHTML = t().result.hintNone; return; }
    hints++;
    for (const kind of ['emoji', 'label']) setValue(kind, target, fn);
    for (const kind of ['emoji', 'label']) {
      const sl = slots[target][kind];
      sl.classList.remove('hinted'); void sl.offsetWidth; sl.classList.add('hinted');
      setTimeout(() => sl.classList.remove('hinted'), 1500);
    }
    Sound.hint();
    Sound.place(target, 'emoji', centerX(slots[target].emoji), true);
    $('#result').innerHTML = t().result.hintOne(FN[fn].e, nameOf(fn));
  }

  function resetBoard() {
    closePicker(false); clearMarks(true);
    state.emoji.fill(null); state.label.fill(null);
    slots.forEach((_, i) => { renderSlot('emoji', i); renderSlot('label', i); });
    afterChange();
    Sound.reset();
  }

  function afterChange() {
    const placed = state.emoji.filter(Boolean).length + state.label.filter(Boolean).length;
    $('#status').textContent = t().place(placed);
    $('#checkBtn').classList.toggle('ready', placed === 16);
  }

  /* ---------- controls ---------- */
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#sub').textContent = t().sub[mode];
    closePicker(false); clearMarks(); Sound.init(); Sound.tick(centerX(b));
  }));
  $('#checkBtn').addEventListener('click', () => { Sound.init(); check(); });
  $('#hintBtn').addEventListener('click', () => { Sound.init(); hint(); });
  $('#resetBtn').addEventListener('click', () => { Sound.init(); resetBoard(); });
  const soundBtn = $('#soundBtn');
  const paintSound = () => {
    const L = t();
    soundBtn.textContent = Sound.on ? '🔊' : '🔇';
    soundBtn.setAttribute('aria-pressed', Sound.on);
    soundBtn.setAttribute('aria-label', Sound.on ? L.btn.soundOff : L.btn.soundOn);
    soundBtn.title = Sound.on ? L.btn.soundOff : L.btn.soundOn;
  };
  soundBtn.addEventListener('click', () => { Sound.toggle(); paintSound(); });
  paintSound();

  function applyLocale() {
    const L = t();
    document.documentElement.lang = locale;
    document.title = L.docTitle;
    $('#h1').innerHTML = L.h1;
    $('#sub').textContent = L.sub[mode];
    $('#howto').textContent = L.howto;
    $('#langSel').value = locale;
    document.querySelector('.seg').setAttribute('aria-label', L.mode.label);
    const segs = document.querySelectorAll('.seg button');
    segs[0].textContent = L.mode.exact;
    segs[1].textContent = L.mode.opposites;
    $('#checkBtn').textContent = L.btn.check;
    $('#hintBtn').textContent = L.btn.hint;
    $('#resetBtn').textContent = L.btn.reset;
    $('#chant').textContent = L.bonds.join(' · ');
    paintSound();
    slots.forEach((_, i) => { renderSlot('emoji', i); renderSlot('label', i); });
    renderBonds();
    afterChange();
  }

  const langSel = $('#langSel');
  for (const [k, v] of Object.entries(LOCALES)) {
    const o = document.createElement('option');
    o.value = k; o.textContent = v.langName;
    langSel.append(o);
  }
  langSel.addEventListener('change', () => {
    locale = LOCALES[langSel.value] ? langSel.value : 'en';
    try { localStorage.setItem('compass-locale', locale); } catch {}
    closePicker(false);
    applyLocale();
    Sound.init(); Sound.tick(centerX(langSel));
  });

  applyLocale();
  renderBonds(true);
})();
</script>
</body>
</html>
